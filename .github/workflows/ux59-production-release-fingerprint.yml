name: UX59 Production Release Fingerprint
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-assets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ux59-prod-asset-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check read-only release verifier
        run: |
          node --check scripts/ux59-production-release-fingerprint.mjs
          node --test tests/ux59-production-release-fingerprint.test.js
      - name: Poll exact production-domain assets after main release
        shell: bash
        run: |
          set -euo pipefail
          # An ordinary merge does not guarantee Vercel READY or alias assignment.
          # The first 40 checks allow the independently managed release to complete.
          # Never writes, promotes, or changes an alias using CI credentials.
          for attempt in $(seq 1 40); do
            if EXPECTED_RELEASE_SHA="${GITHUB_SHA}" node scripts/ux59-production-release-fingerprint.mjs; then
              echo "PASS: production assets match checked-out main SHA ${GITHUB_SHA}"
              exit 0
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::UX59.9 production release incomplete or domain alias stale for ${GITHUB_SHA}"
              exit 1
            fi
            echo "Release not yet visible on public domain (attempt ${attempt}/40)"
            sleep 15
          done
      - name: Record verified production release evidence
        if: success()
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_RECEIPT_PATH: release-receipt.json
        run: node scripts/ux59-production-release-receipt.mjs
      - name: Upload release evidence for rollback review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wordsky-production-receipt-${{ github.sha }}
          path: release-receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Summarize production commit and diagnose stale alias
        if: always()
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ux59-release-diagnostics.mjs
