name: UX59.35 Post-Deploy Production HTTP Smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  syntax-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate post-deploy smoke syntax without credentials
        run: node --check scripts/ux59-35-postdeploy-smoke.mjs

  post-deploy-get:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    concurrency:
      group: ux59-35-production-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Assert checked-out commit equals workflow main SHA
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          node --check scripts/ux59-35-postdeploy-smoke.mjs
      - name: Verify exact SHA deployment then GET-only production routes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ux59-35-postdeploy-smoke.mjs
