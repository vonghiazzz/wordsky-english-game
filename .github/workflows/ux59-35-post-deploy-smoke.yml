name: UX59.35 Post-Deploy Production HTTP Smoke
on:
  pull_request:
    branches: [main]
  # Wait for Vercel's commit SUCCESS event, not the earlier main push.
  # Preview branch statuses do not match the current main HEAD.
  status:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  syntax-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate post-deploy smoke syntax without credentials
        run: node --check scripts/ux59-35-postdeploy-smoke.mjs

  post-deploy-get:
    # A Vercel success must refer to the current default-branch commit.
    # Manual rerun remains available after an explicit production release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       github.event.sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: ux59-35-production-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Assert current main and exact Vercel event SHA
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEPLOYED_SHA: ${{ github.event.sha }}
          STATUS_CONTEXT: ${{ github.event.context }}
          STATUS_STATE: ${{ github.event.state }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          if [ "$GITHUB_EVENT_NAME" = "status" ]; then
            test "$STATUS_CONTEXT" = "Vercel"
            test "$STATUS_STATE" = "success"
            test "$DEPLOYED_SHA" = "$COMMIT_SHA"
          fi
          node --check scripts/ux59-35-postdeploy-smoke.mjs
      - name: Publish pending post-deploy status for exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context="WordSky Post-Deploy HTTP Smoke" \
            -f description="Waiting for exact-SHA deployment and live GET checks" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Verify exact SHA deployment then GET-only production routes
        id: smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ux59-35-postdeploy-smoke.mjs
      - name: Publish final post-deploy status for exact commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state=success
            description="Exact-SHA deployment and 8 read-only production GET checks PASS"
          else
            state=failure
            description="Post-deploy validation failed or did not run; inspect workflow logs"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="WordSky Post-Deploy HTTP Smoke" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
