name: UX26 Production Read-only Smoke
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/ux26-production-readonly-smoke.mjs'
      - '.github/workflows/ux26-production-readonly-smoke.yml'

permissions:
  contents: read

jobs:
  live-readonly-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium firefox
      - name: Check public Production without writing data
        run: node scripts/ux26-production-readonly-smoke.mjs
