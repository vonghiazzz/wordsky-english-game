name: WordSky Learning CI
on:
  push:
    branches:
      - 'feature/ux23c-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wordsky
          POSTGRES_PASSWORD: wordsky_ci_only
          POSTGRES_DB: wordsky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordsky -d wordsky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Run all tests (including isolated PostgreSQL concurrency)
        run: npm test
        env:
          UX23C_TEST_DATABASE_URL: postgres://wordsky:wordsky_ci_only@127.0.0.1:5432/wordsky_test
