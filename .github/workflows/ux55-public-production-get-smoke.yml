name: UX55 Production Public GET Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readonly-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify smoke script syntax
        run: node --check scripts/ux55-production-get-smoke.mjs
      - name: Read-only HTTPS GET against public Production
        run: node scripts/ux55-production-get-smoke.mjs
      - name: UX56 public lexical inventory (GET-only)
        run: |
          node --check scripts/ux56-public-vocabulary-quality-audit.mjs
          node scripts/ux56-public-vocabulary-quality-audit.mjs
        # Never provide accounts, tokens, cookies or Production DB secrets.
        # This does not exercise account history or write learner records.
