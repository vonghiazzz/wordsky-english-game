name: UX55 Production Public GET Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readonly-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify smoke script syntax
        run: node --check scripts/ux55-production-get-smoke.mjs
      - name: Read-only HTTPS GET against public Production
        run: node scripts/ux55-production-get-smoke.mjs
      - name: UX59.14 anonymous account and SRS isolation (GET-only)
        run: |
          node --check scripts/ux59-production-guest-isolation.mjs
          node --test tests/ux59-production-guest-isolation.test.js
          node scripts/ux59-production-guest-isolation.mjs
        # No cookies, test account credentials, authentication writes or Production DB changes.
      - name: UX56 public lexical inventory (GET-only)
        run: |
          node --check scripts/ux56-public-vocabulary-quality-audit.mjs
          node scripts/ux56-public-vocabulary-quality-audit.mjs
        # Never provide accounts, tokens, cookies or Production DB secrets.
        # This does not exercise account history or write learner records.
      - name: UX61.5 guard production Vietnamese cue ambiguity (GET-only)
        run: |
          node --check scripts/ux61-production-cue-policy-guard.mjs
          node scripts/ux61-production-cue-policy-guard.mjs --live
        # No auth, no cookies, no SRS history and no Production mutation.
      - name: UX61.8 require exact pending editorial source evidence (GET-only)
        run: |
          node --check scripts/ux61-8-review-production.mjs
          node scripts/ux61-8-review-production.mjs --live
        # Never accept an approval receipt from this offline packet or write user data.
