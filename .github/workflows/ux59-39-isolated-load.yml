name: UX59.39 Isolated Local Load Benchmark
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-local-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate benchmark scripts and safety regression tests
        run: |
          node --check lib/ux59-39-local-load.js
          node --check scripts/ux59-39-local-load.mjs
          node --test tests/ux59-39-local-load.test.js
      - name: Run capped anonymous GET load only against isolated WordSky local server
        run: |
          set -euo pipefail
          PORT=32195 node scripts/local-server.js >"$RUNNER_TEMP/ux59-39-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:32195/progress.html -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:32195/progress.html -o /dev/null
          node scripts/ux59-39-local-load.mjs --base http://127.0.0.1:32195 --requests 120 --concurrency 6 --rps 20
